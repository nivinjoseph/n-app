approvedGitRepositories:
  - "**"

enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 0d

# Strips the builtin TypeScript PnP compat patch, which breaks installing the
# TS 7 native-compiler package (yarnpkg/berry#7191). Unneeded with
# nodeLinker: node-modules; drop once Yarn ships yarnpkg/berry#7190.
plugins:
  - path: .yarn/plugins/plugin-disable-typescript-compat.cjs
    spec: "plugin-disable-typescript-compat"

yarnPath: .yarn/releases/yarn-4.16.0.cjs
